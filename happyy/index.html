<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="birthday-card">

        <section class="cake-area">

            <div class="cake">

                <!-- Mum -->
                <div class="candle">
                    <div class="flame"></div>
                </div>

                <!-- Krema -->
                <div class="icing">
                    <span class="drip drip1"></span>
                    <span class="drip drip2"></span>
                    <span class="drip drip3"></span>
                    <span class="drip drip4"></span>
                </div>

                <!-- Pasta katları -->
                <div class="cake-layer layer-top"></div>
                <div class="cake-layer layer-middle"></div>
                <div class="cake-layer layer-bottom"></div>

            </div>

            <!-- Tabak -->
            <div class="plate"></div>

        </section>

        <h1>Happy birthday!</h1>
        <p>Love</p>

    </main>

    <script src="script.js"></script>

</body>
</html>
